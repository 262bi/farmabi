site_name: Inteligencia de Negocios
site_description: Documentacion del proyecto BI farmabi
repo_url: https://github.com/262bi/farmabi
repo_name: 262bi/farmabi
docs_dir: docs

nav:
  - Inicio: index.md
  - Guía de Proyecto Sello:
      - Guía del proyecto: proyecto-sello/index.md
  - Silabos:
      - Silabo 2026-1: silabo_bi_2026_1.md
      - Silabo 2026-2: silabo_bi_2026_2.md
  - 1. Definición del sistema de información para ejecutivos:
      - S1 - Fundamentos BI y problema de negocio: sesiones/S01_Fundamentos_BI_Problema_Negocio.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details

plugins:
  - search

extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - javascripts/mermaid.js
